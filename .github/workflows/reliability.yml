name: Reliability checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: python -m pip install -e ".[studio,upload,test]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check src scripts tests apps/webeditor_legacy/backend --select F,E9
      - run: npm ci
        working-directory: apps/web-studio/frontend
      - run: npm run check
        working-directory: apps/web-studio/frontend
      - run: npm run build
        working-directory: apps/web-studio/frontend
      - run: npm ci
        working-directory: apps/webeditor_legacy/frontend
      - run: npm run build
        working-directory: apps/webeditor_legacy/frontend
      - run: python -m pytest -q
