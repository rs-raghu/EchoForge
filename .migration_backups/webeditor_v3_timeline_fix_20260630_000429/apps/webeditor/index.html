<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EchoForge WebEditor V2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo-dot"></div>
        <div>
          <div class="brand-title">EchoForge WebEditor</div>
          <div class="brand-subtitle" id="projectTitle">Loading project...</div>
        </div>
      </div>

      <div class="top-actions">
        <button id="btnUndo" title="Undo">Undo</button>
        <button id="btnRedo" title="Redo">Redo</button>
        <button id="btnSave" class="primary">Save</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="left-panel">
        <div class="panel-title">Tools</div>
        <button id="toolSelect" class="tool active">Pointer</button>
        <button id="btnAddText" class="tool">Add Text</button>
        <button id="btnSplit" class="tool">Split at Playhead</button>
        <button id="btnDelete" class="tool danger">Delete Clip</button>

        <div class="panel-title mt">Project</div>
        <div class="info-row"><span>Duration</span><b id="infoDuration">--</b></div>
        <div class="info-row"><span>Selected</span><b id="infoSelected">None</b></div>
        <div class="info-row"><span>Font</span><b id="fontStatus">Checking...</b></div>

        <div class="panel-title mt">Timeline Zoom</div>
        <input id="zoomSlider" type="range" min="4" max="30" value="10" />
      </aside>

      <section class="center-area">
        <section class="viewer-shell">
          <div class="viewer-top">
            <span id="timeReadout">00:00.000 / 00:00.000</span>
            <span id="statusText">Ready</span>
          </div>

          <div id="viewer" class="viewer">
            <img id="backgroundImg" class="background-img" alt="Background" />
            <div id="lyricOverlay" class="lyric-overlay"></div>
            <div id="selectedBox" class="selected-box hidden">
              <div class="resize-dot nw"></div>
              <div class="resize-dot ne"></div>
              <div class="resize-dot sw"></div>
              <div class="resize-dot se"></div>
            </div>
          </div>

          <div class="transport">
            <button id="btnStart">|◀</button>
            <button id="btnBack">−5s</button>
            <button id="btnPlay" class="play">▶</button>
            <button id="btnForward">+5s</button>
            <button id="btnEnd">▶|</button>
            <input id="masterSeek" type="range" min="0" max="1000" value="0" />
          </div>

          <audio id="audio" preload="metadata"></audio>
        </section>

        <section class="timeline-shell">
          <div class="timeline-header">
            <div class="timeline-left-title">Timeline</div>
            <div class="timeline-ruler-wrap" id="rulerWrap">
              <div id="ruler" class="ruler"></div>
            </div>
          </div>

          <div class="timeline-body">
            <div class="track-labels" id="trackLabels"></div>
            <div class="tracks-viewport" id="tracksViewport">
              <div id="playhead" class="playhead"></div>
              <div id="tracks" class="tracks"></div>
            </div>
          </div>
        </section>
      </section>

      <aside class="right-panel">
        <div class="panel-title">Inspector</div>

        <label>Clip text</label>
        <textarea id="clipText" rows="4" placeholder="Select a text clip"></textarea>

        <div class="grid2">
          <div>
            <label>Start</label>
            <input id="clipStart" type="number" step="0.01" />
          </div>
          <div>
            <label>End</label>
            <input id="clipEnd" type="number" step="0.01" />
          </div>
        </div>

        <div class="grid2">
          <div>
            <label>X</label>
            <input id="clipX" type="number" step="1" />
          </div>
          <div>
            <label>Y</label>
            <input id="clipY" type="number" step="1" />
          </div>
        </div>

        <div class="grid2">
          <div>
            <label>Width</label>
            <input id="clipWidth" type="number" step="1" />
          </div>
          <div>
            <label>Font size</label>
            <input id="fontSize" type="number" step="1" />
          </div>
        </div>

        <label>Font</label>
        <select id="fontFamily">
          <option value="Bernier">Bernier</option>
          <option value="Arial">Arial</option>
          <option value="Impact">Impact</option>
          <option value="Georgia">Georgia</option>
        </select>

        <label>Color</label>
        <input id="fontColor" type="color" />

        <div class="button-grid">
          <button id="btnApplySelected">Apply Selected</button>
          <button id="btnApplyAll">Apply Style To All Lyrics</button>
        </div>

        <div class="panel-title mt">Clip List</div>
        <div id="clipList" class="clip-list"></div>
      </aside>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
